# TosheLabs Pipeline — Project Configuration (example)
# Copy this file to `pipeline.config.yaml` and edit the paths for your project.

name: my-project
project_dir: /absolute/path/to/your/project

# Backlog source (JSON — see docs for shape)
backlog_file: memory/backlog.json
archive_file: memory/backlog-archive.json
closed_bugs_file: memory/closed-bugs.json

# Validation rules (injected into every Claude session)
validation_rules: memory/code_validation.md

# Pipeline state
pipeline_dir: memory/pipeline
build_log_dir: memory/build-log
code_lock: code.lock

# Context files (read at session start, injected into plan step)
context_files:
  - memory/SPEC.md
  - memory/ARCHITECTURE.md
  - memory/DATA_MODEL.md
  - memory/FLOWS.md
  - memory/MEMORY.md

# Environment (injected into every CLI call)
environment:
  PATH: "${PATH}"

# Project-specific assumptions — used by prompts and the tests_green runner.
# Everything the pipeline needs to know about your toolchain goes here.
project_profile:
  # One-line summary injected into the plan prompt. Guides what kinds of
  # components the plan should consider (e.g. "Flutter/Dart app with
  # Firebase backend — consider model, repository, provider, widget, tests").
  tech_stack_hints: "describe your stack in one line"

  # Extra files the docs_update step should check for staleness (beyond
  # the standard memory/SPEC.md, ARCHITECTURE.md, DATA_MODEL.md, FLOWS.md).
  docs_check_files:
    # - app/lib/help_screen.dart  — user-facing text
    # - docs/public-api.md        — API surface

  # Commands run by the built-in tests_green runner. Each phase has:
  # Structure:
  #   unit:          singular primary phase — must produce passed/failed stats
  #   analyzer:      singular primary phase — must produce an issue count
  #   extras:        dict of additional phases (e.g. backend, integration)
  #                  Each extra is conditional on `trigger_file_prefix`.
  #
  # Common spec fields:
  #   cmd                  — shell command (run with `2>&1`; quoting is yours)
  #   cwd                  — relative to project_dir (optional)
  #   timeout_sec          — per-phase timeout in seconds (default 600)
  # Unit-specific:
  #   stats_pattern        — regex capturing (passed, failed). Matched with /g;
  #                          the LAST match is used. Defaults to Flutter's format.
  #   failed_name_pattern  — regex capturing the failing test name
  #   failed_line_marker   — substring flagging a failed line
  # Analyzer-specific:
  #   success_marker       — substring that means "clean" (default: "No issues found")
  #   issue_pattern        — regex capturing issue count (default: "(\\d+)\\s+issue")
  # Extras-specific:
  #   trigger_file_prefix  — only run if implement.files_changed touched
  #                          a path starting with this prefix
  test_commands:
    # Example for a Flutter/Dart + Firebase Cloud Functions project:
    # unit:
    #   cmd: "flutter test test/unit/"
    #   cwd: app
    #   timeout_sec: 600
    #   stats_pattern: "\\+(\\d+)\\s+-(\\d+):\\s"
    #   failed_name_pattern: ":\\s+(.+?)\\s+\\[E\\]"
    #   failed_line_marker: "[E]"
    # analyzer:
    #   cmd: "flutter analyze"
    #   cwd: app
    #   timeout_sec: 120
    #   success_marker: "No issues found"
    #   issue_pattern: "(\\d+)\\s+issue"
    # extras:
    #   backend:
    #     cmd: "npm test"
    #     cwd: backend/functions
    #     timeout_sec: 120
    #     trigger_file_prefix: "backend/"

# Ticket filtering
ticket_filter:
  exclude_status: [done, v2, deferred, manual, moot, decided, subsumed]
  priority_order: [P0, P1, P2, P3]
  type_order: [bug, feature, enhancement, refactor, test, performance, ux]

# Session management (Max plan)
session:
  model: opus
  context_warning_pct: 75
  context_new_session_pct: 90
  max_turns_per_step: 30

# Think loop
think_loop:
  max_rounds: 2
  max_discards: 1

# Steps (ordered, configurable). Each step drives one Claude session.
steps:
  - name: plan
    prompt_template: prompts/plan.md
    tools:
      - Read
      - Grep
      - Glob
      - "Bash(git *)"
    think_loop: true
    think_challenge: "Missing files? Missing callers? Edge cases that will break at runtime? Implicit assumptions not stated? Will this plan produce code that passes review first time?"
    inject_validation_rules: true
    model: opus
    effort: high
    max_turns: 25
    validation:
      - field: files_to_change
        rule: non_empty_array
      - field: callers_traced
        rule: non_empty_array
      - field: edge_cases
        rule: non_empty_array
      - field: test_strategy
        rule: non_empty_string

  - name: tests_red
    prompt_template: prompts/tests_red.md
    tools:
      - Read
      - Grep
      - Glob
      - Write
      - Edit
      - "Bash(flutter *)"
      - "Bash(npm *)"
    think_loop: false
    inject_validation_rules: false
    model: sonnet
    max_turns: 20
    validation:
      - field: outcome
        rule: one_of
        values: [new_test_fails, existing_test_fails, existing_test_covers]
      - field: failure_output
        rule: non_empty_string
        unless:
          field: outcome
          equals: existing_test_covers
      - field: criteria_to_test_map
        rule: covers_plan_criteria

  - name: implement
    prompt_template: prompts/implement.md
    reuse_session: true   # reuses tests_red session — test files + failure output already in context
    tools:
      - Read
      - Grep
      - Glob
      - Edit
      - Write
    think_loop: true
    think_challenge: "Can the code be simpler? Missed edge cases? Clear naming? Breaks under concurrency/null/empty? Silent catch blocks?"
    inject_validation_rules: true
    model: sonnet
    effort: high
    max_turns: 30
    validation:
      - field: files_changed
        rule: non_empty_array
      - field: files_changed
        rule: covers_plan

  - name: tests_green
    prompt_template: prompts/tests_green.md
    tools:
      - "Bash(flutter *)"
      - "Bash(npm *)"
      - Read
      - Edit
      - Write
    think_loop: false
    inject_validation_rules: false
    model: haiku
    max_turns: 20
    validation:
      # `equals` (not `equals_or_missing`) — forces the field to be present
      # and zero. A missing field used to pass the gate silently, letting
      # regression-introducing tickets slip through tests_green.
      - field: new_failures
        rule: equals
        value: 0
      - field: analyzer_errors
        rule: equals
        value: 0

  - name: review
    prompt_template: prompts/review.md
    reuse_session: true   # reuses tests_green session — test output already in context
    tools:
      - Read
      - Grep
      - Glob
      - Edit
      - Write
    think_loop: true
    think_challenge: "Missed any checklist items? False positives? Unfixed findings that should have been fixed? Missing test coverage for new code paths?"
    inject_validation_rules: true
    model: opus
    effort: high
    max_turns: 25
    validation:
      - field: checklist_items_checked
        rule: greater_than
        value: 0
      - field: findings_fixed
        rule: true_if_findings

  - name: root_cause
    prompt_template: prompts/root_cause.md
    tools:
      - Read
      - Grep
      - Glob
    think_loop: false
    inject_validation_rules: false
    model: sonnet
    max_turns: 10
    condition:
      field: type
      equals: bug
    validation:
      - field: why_happened
        rule: non_empty_string
      - field: why_not_caught
        rule: non_empty_string
      - field: proposed_rule
        rule: non_empty_string

  - name: docs_update
    prompt_template: prompts/docs_update.md
    reuse_session: true   # reuses root_cause session (or review session for features)
    tools:
      - Read
      - Grep
      - Glob
      - Edit
      - Write
    think_loop: false
    inject_validation_rules: false
    model: sonnet
    max_turns: 25
    validation:
      - field: files_updated
        rule: non_empty_array

# Web UI
server:
  port: 3847
  host: "::"
